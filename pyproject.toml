[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-lint-mcp"
version = "0.1.0"
description = "MCP server giving AI agents a physics oracle for S-parameter and coupling models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ChipletOS / Genesis contributors" }]
keywords = ["mcp", "model-context-protocol", "llm", "agent", "rf",
            "s-parameters", "physics", "validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["sparam-lint>=0.1.0", "maxwell-lint>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
physics-lint-mcp = "physics_lint_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
